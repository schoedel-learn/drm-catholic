version: 2
updates:
  # Monitor Composer dependencies (PHP/Laravel)
  - package-ecosystem: "composer"
    directory: "/laravel"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    reviewers:
      - "schoedel-learn"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor npm dependencies (Laravel)
  - package-ecosystem: "npm"
    directory: "/laravel"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    reviewers:
      - "schoedel-learn"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    reviewers:
      - "schoedel-learn"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
