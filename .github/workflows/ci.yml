name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring xml ctype fileinfo pdo pgsql pdo_pgsql
          coverage: none

      - name: Install sandbox test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap zsh

      # Ubuntu 24.04 (the runner image) restricts unprivileged user namespaces
      # by default via AppArmor, which makes the bwrap sandbox in
      # StartupConfigurationTest fail with a permission error instead of running
      # the script. Lift the restriction for this job so the sandbox tests
      # execute for real rather than being skipped or bypassed.
      - name: Allow unprivileged user namespaces for the bubblewrap sandbox tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run full migration chain against PostgreSQL
        run: php artisan migrate:fresh --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel/package-lock.json

      # resources/js/app.js imports Ziggy's JS from Composer's vendor directory
      # (../../vendor/tightenco/ziggy), so the frontend build needs the Composer
      # dependencies present too — same coupling the Dockerfile handles by
      # copying vendor/tightenco/ziggy into the assets stage.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install smoke test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh jq iproute2 openssl

      - name: Run container smoke test
        run: npm run demo:smoke

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: laravel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: laravel/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
