name: "CodeQL"

on:
  push:
    # Scan every branch, not just main: the repository's "Branch Protection"
    # ruleset requires a code-scanning result for a pull request's *head* commit
    # before it can merge, but CodeQL's pull_request runs upload results only
    # against the synthetic merge ref. Scanning branch pushes gives each head
    # commit a real CodeQL result so the rule can be satisfied honestly.
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
